[project]
name = "demojo"
version = "0.1.0"
description = "Demojo: turn product screenshots, photos, and rough screen recordings into a polished, narrated product demo video."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "fonttools>=4.53",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
demojo = "demojo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demojo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "render: tests that invoke ffmpeg to render real video (slower)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
